<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio. - Home</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=1,300;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght=300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0813;
            --accent-pink: #ff65a3;
            --accent-pink-glow: rgba(255, 101, 163, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none; /* Nasconde il puntatore nativo */
        }

        @media (hover: none) and (pointer: coarse) {
            body { cursor: auto; }
            .custom-cursor { display: none !important; }
        }

        /* ==========================================================================
           PUNTATORE MOUSE PERSONALIZZATO (PALLINO + TRACCIA CONCENTRICA)
           ========================================================================== */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
        }

        .cursor-ring {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.3s ease,
                        background-color 0.3s ease;
            z-index: 9999;
        }

        .custom-cursor.expand .cursor-ring {
            width: 56px;
            height: 56px;
            border-color: var(--accent-pink);
            background-color: rgba(255, 101, 163, 0.05);
        }

        /* ==========================================================================
           NAVBAR (Minimal Glass)
           ========================================================================== */
        .navbar-container {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.8rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            cursor: none;
        }

        .nav-link:hover, .nav-link.home-active {
            color: var(--text-primary);
        }

        .nav-link.home-active {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            text-transform: none;
            letter-spacing: 0.02em;
        }

        /* ==========================================================================
           HERO HEADER: SUPERFICIE GENERATIVA FLUIDA
           ========================================================================== */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 0 20px;
        }

        /* Il Canvas generativo occupa una zona centrale definita, agendo da finestra olografica */
        .fluid-canvas-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 650px;
            z-index: 1;
            pointer-events: none;
            border-radius: 50%;
            /* Maschera di sfocatura morbida per fondere i bordi del fluido generativo nell'oscurità totale */
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 70%);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 70%);
        }

        #fluidCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Luce d'atmosfera sottostante fissa per dare profondità */
        .ambient-backlight {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(142, 28, 87, 0.25) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(40px);
            pointer-events: none;
        }

        /* ==========================================================================
           CONTENUTO EDITORIALE
           ========================================================================== */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 4.4rem;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 25px;
            pointer-events: none;
        }

        .hero-title span.italic-font {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0em;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 540px;
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 40px;
            pointer-events: none;
        }

        /* CTA RETTANGOLARE MINIMALISTA */
        .hero-cta {
            display: inline-block;
            padding: 16px 40px;
            background: #ffffff;
            color: #0b0813;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 0px; /* Rigorosamente rettangolare */
            transition: background-color 0.3s ease, color 0.3s ease, outline 0.3s ease, box-shadow 0.3s ease;
            outline: 1px solid transparent;
            cursor: none;
        }

        .hero-cta:hover {
            background-color: var(--bg-color);
            color: #ffffff;
            outline: 1px solid #ffffff;
            box-shadow: 0 0 35px var(--accent-pink-glow);
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.8rem; }
            .fluid-canvas-container { width: 380px; height: 380px; }
            .ambient-backlight { width: 340px; height: 340px; }
            .hero-subtitle { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="customCursor">
        <div class="cursor-dot" id="cursorDot"></div>
        <div class="cursor-ring" id="cursorRing"></div>
    </div>

    <div class="navbar-container">
        <nav class="navbar">
            <a href="#" class="nav-logo">Studio.</a>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link home-active">Home</a></li>
                <li><a href="servizi.html" class="nav-link interactable">Servizi</a></li>
                <li><a href="#" class="nav-link interactable">Progetti</a></li>
                <li><a href="#" class="nav-link interactable">Contatti</a></li>
            </ul>
        </nav>
    </div>

    <section class="hero-section" id="heroInteractionArea">
        <div class="ambient-backlight"></div>
       
        <div class="fluid-canvas-container">
            <canvas id="fluidCanvas"></canvas>
        </div>

        <div class="hero-content">
            <h1 class="hero-title">
                Plasmiamo <span class="italic-font">idee</span>.<br>
                Diamo forma al <span class="italic-font">futuro</span>.
            </h1>
            <p class="hero-subtitle">
                Studio di progettazione visiva e sviluppo d'eccellenza. Trasformiamo visioni complesse in architetture digitali fluide, uniche e coerenti.
            </p>
            <a href="servizi.html" class="hero-cta interactable">Scopri i servizi</a>
        </div>
    </section>

    <script>
        const cursor = document.getElementById('customCursor');
const dot = document.getElementById('cursorDot');
const ring = document.getElementById('cursorRing');

const heroArea = document.getElementById('heroInteractionArea');
const canvas = document.getElementById('fluidCanvas');
const ctx = canvas.getContext('2d');

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let dotX = window.innerWidth / 2;
let dotY = window.innerHeight / 2;
let ringX = window.innerWidth / 2;
let ringY = window.innerHeight / 2;

let localMouseX = canvas.width / 2;
let localMouseY = canvas.height / 2;
let isInteracting = false;
let interactionIntensity = 0;

// Ottimizzazione mobile: riduce la risoluzione interna solo se touch per salvare performance
function initCanvasSize() {
    const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    canvas.width = isMobile ? 150 : 300;
    canvas.height = isMobile ? 150 : 300;
}
initCanvasSize();

// Allocazione singola dell'oggetto ImageData per evitare memory leak e lag su mobile
const imgData = ctx.createImageData(canvas.width, canvas.height);
const data = imgData.data;
const w = canvas.width;
const h = canvas.height;

// Funzione unica per mappare le coordinate relative al centro del canvas
function updateCoordinates(clientX, clientY) {
    const rect = heroArea.getBoundingClientRect();
    const canvasX = clientX - rect.left - (rect.width / 2) + (w / 2);
    const canvasY = clientY - rect.top - (rect.height / 2) + (h / 2);
   
    localMouseX = (canvasX / (rect.width / 2)) * w;
    localMouseY = (canvasY / (rect.height / 2)) * h;
}

// 1. TRACCIAMENTO DEI MOVIMENTI (Desktop)
window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    updateCoordinates(e.clientX, e.clientY);
});

document.querySelectorAll('.interactable').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
});

heroArea.addEventListener('mouseenter', () => {
    isInteracting = true;
    cursor.classList.add('expand');
});

heroArea.addEventListener('mouseleave', () => {
    isInteracting = false;
    cursor.classList.remove('expand');
});

// Supporto Mobile Touch Corretto
heroArea.addEventListener('touchstart', (e) => {
    isInteracting = true;
    if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
        updateCoordinates(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

heroArea.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
        updateCoordinates(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

heroArea.addEventListener('touchend', () => {
    isInteracting = false;
});

// 2. LOGICA DI ANIMAZIONE
let time = 0;

function animateFluid() {
    // Smooth del puntatore personalizzato
    dotX += (mouseX - dotX);
    dotY += (mouseY - dotY);
    ringX += (mouseX - ringX) * 0.16;
    ringY += (mouseY - ringY) * 0.16;

    dot.style.left = `${dotX}px`;
    dot.style.top = `${dotY}px`;
    ring.style.left = `${ringX}px`;
    ring.style.top = `${ringY}px`;

    if (isInteracting) {
        interactionIntensity += (1.0 - interactionIntensity) * 0.05;
    } else {
        interactionIntensity += (0.0 - interactionIntensity) * 0.05;
    }

    time += 0.012 + (interactionIntensity * 0.015);

    // Ciclo di generazione cromatica ottimizzato
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
           
            let v1 = Math.sin(x * 0.015 + time);
            let v2 = Math.sin(0.015 * (x * Math.sin(time / 2) + y * Math.cos(time / 3)) + time);
           
            const dx = x - localMouseX;
            const dy = y - localMouseY;
            const distToMouse = Math.sqrt(dx * dx + dy * dy);
           
            let mouseWave = 0;
            if (interactionIntensity > 0.01) {
                mouseWave = Math.sin(distToMouse * 0.12 - time * 4) * (60 / (distToMouse + 15)) * interactionIntensity;
            }

            let totalValue = v1 + v2 + mouseWave;
            let plasmaFactor = (Math.sin(totalValue * Math.PI) + 1) / 2;

            const pixelIndex = (x + y * w) * 4;

            data[pixelIndex]     = Math.floor(14 * (1 - plasmaFactor) + 255 * plasmaFactor);
            data[pixelIndex + 1] = Math.floor(8 * (1 - plasmaFactor) + 101 * plasmaFactor);
            data[pixelIndex + 2] = Math.floor(21 * (1 - plasmaFactor) + 163 * plasmaFactor);
            data[pixelIndex + 3] = Math.floor(255 * (plasmaFactor * 0.9 + 0.1));
        }
    }

    ctx.putImageData(imgData, 0, 0);
    requestAnimationFrame(animateFluid);
}

animateFluid();
    </script>
</body>
</html>
