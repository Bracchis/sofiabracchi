<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB - Contatti</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=1,300;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght=300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #06040a;
            --accent-neutral: #a04555; /* Tortora/Champagne desaturato */
            --accent-neutral-glow: rgba(163, 150, 137, 0.25);
            --accent-pink: #ff65a3;
             --accent-pink-glow: rgba(255, 101, 163, 0.25);
            --accent-blue: #4d61ff;
            --accent-cyan: #00f0ff;
            --accent-sad: #4a3b6e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.01);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-blur: 30px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
            cursor: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (hover: none) and (pointer: coarse) {
            body { cursor: auto; }
            .custom-cursor { display: none !important; }
        }

        /* ==========================================================================
           PUNTATORE MOUSE PERSONALIZZATO
           ========================================================================== */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
        }

        .cursor-ring {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.3s ease,
                        background-color 0.3s ease;
            z-index: 9999;
        }

        .custom-cursor.expand .cursor-ring {
            width: 56px;
            height: 56px;
            border-color: var(--accent-pink);
            background-color: rgba(255, 101, 163, 0.05);
        }

          .logo-img {
    height: 30px; /* Regola l'altezza in base alle tue esigenze */
    width: auto;  /* Mantiene le proporzioni corrette dell'immagine */
    display: block;
}

       /* ==========================================================================
           NAVBAR (Minimal Glass)
           ========================================================================== */
        .navbar-container {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 100;
        }

        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px;
        }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.8rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.01em;
            z-index: 120;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s ease, font-family 0.3s ease, font-style 0.3s ease;
            position: relative;
            padding: 5px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link.active {
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            text-transform: none;
            letter-spacing: 0.02em;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            border: none;
            background: transparent;
            z-index: 120;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--text-primary);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================================
           INTERFACCIA IMMERSIVA UNIFICATA
           ========================================================================== */
        .contact-section {
            width: 100%;
            padding: 120px 4% 60px 4%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Sfondo con Glow di atmosfera dinamico */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 101, 163, 0.08) 0%, rgba(0, 240, 255, 0.02) 50%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            transition: background 0.8s ease;
        }

        /* La Card Unica */
        .immersive-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 750px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 60px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .contact-title {
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .contact-title span.italic-font {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Form Rigoroso Minimalista */
        .minimal-form {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .form-group {
            position: relative;
            width: 100%;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.4s ease;
            cursor: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-bottom-color: rgba(255, 255, 255, 0.6);
        }

        .form-group label {
            position: absolute;
            top: 14px;
            left: 0;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
        }

        .form-group input:focus ~ label,
        .form-group input:not(:placeholder-shown) ~ label,
        .form-group textarea:focus ~ label,
        .form-group textarea:not(:placeholder-shown) ~ label {
            transform: translateY(-24px);
            color: rgba(255, 255, 255, 0.8);
        }

        /* Zona Inferiore Unificata (Invio + Faccina) */
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 40px;
        }

        .submit-btn {
            display: flex;
            align-items: center;
            gap: 20px;
            background: transparent;
           font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px;
            padding: 16px 36px;
            cursor: none;
            transition: all 0.4s ease;
        }

        .submit-btn span {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: #ffffff;
        }

        .submit-btn .arrow-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover {
           background-color: #ffffff;
            color: #0b0813;
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .submit-btn:hover .arrow-icon {
            transform: translateX(6px);
        }

        /* ==========================================================================
           IL GUARDIANO INTERATTIVO (FACCINA INTEGRATA IN BASSO)
           ========================================================================== */
        .character-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
        }

        #interactiveCharacter {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        /* Transizioni fluide degli elementi SVG */
        .char-body-bg {
            transition: fill 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .eye-white {
            transition: ry 0.3s ease, rx 0.3s ease;
        }

        .pupil {
            transition: rx 0.3s ease, ry 0.3s ease, fill 0.4s ease, cx 0.3s ease, cy 0.3s ease;
        }

        .char-mouth {
            transition: d 0.3s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
        }

        .character-status {
            margin-top: 10px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            white-space: nowrap;
            transition: color 0.4s ease;
        }

        /* Links in fondo */
        .direct-links {
            display: flex;
            justify-content: center;
            gap: 50px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 40px;
            margin-top: 20px;
        }

        .direct-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: none;
        }

        .link-label {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.3);
        }

        .link-value {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.3s ease;
        }

        .direct-link:hover .link-value {
            color: #ffffff;
        }
       
        .footer {
            width: 100%;
            max-width: 1200px;
            margin-top: 120px;
            padding: 40px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .footer-credits {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        .footer-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .footer-link:hover { color: var(--text-primary); }
       

        @media (max-width: 768px) {
             .hamburger { display: flex; }
           
            .nav-menu {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background: rgba(11, 8, 19, 1);
                backdrop-filter: blur(40px) saturate(180%);
                -webkit-backdrop-filter: blur(40px) saturate(180%);
                flex-direction: column;
                justify-content: center;
                gap: 30px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.5s ease;
                z-index: 110;
            }

            .nav-menu::before, .nav-menu::after {
                content: '';
                position: absolute;
                width: 250px;
                height: 250px;
                border-radius: 50%;
                filter: blur(80px);
                opacity: 0;
                transition: opacity 0.8s ease, transform 0.8s ease;
                z-index: -1;
                pointer-events: none;
            }

            .nav-menu::before {
                background: var(--accent-pink);
                top: 15%;
                left: -10%;
                transform: translate(-50px, -50px);
            }

            .nav-menu::after {
                background: var(--accent-blue);
                bottom: 15%;
                right: -10%;
                transform: translate(50px, 50px);
            }

            .nav-menu.active {
                opacity: 1;
                pointer-events: auto;
            }

            .nav-menu.active::before { opacity: 0.25; transform: translate(0, 0); }
            .nav-menu.active::after { opacity: 0.25; transform: translate(0, 0); }

            .nav-menu li {
                transform: translateY(30px);
                opacity: 0;
                transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            }

            .nav-menu.active li {
                transform: translateY(0);
                opacity: 1;
            }

            .nav-menu.active li:nth-child(1) { transition-delay: 0.1s; }
            .nav-menu.active li:nth-child(2) { transition-delay: 0.18s; }
            .nav-menu.active li:nth-child(3) { transition-delay: 0.26s; }
            .nav-menu.active li:nth-child(4) { transition-delay: 0.34s; }

            .nav-link {
                font-size: 1.6rem;
                text-transform: uppercase;
                display: inline-block;
            }

            .nav-link.active {
                font-size: 2.2rem;
            }

            .nav-link::after {
                content: '';
                position: absolute;
                bottom: -5px;
                left: 50%;
                width: 0;
                height: 1px;
                background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink));
                transition: width 0.3s ease, left 0.3s ease;
            }

            .nav-link:hover::after, .nav-link.active::after {
                width: 100%;
                left: 0;
            }
           
            .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); background-color: #fff; }
            .hamburger.active span:nth-child(2) { opacity: 0; }
            .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); background-color: #fff; }
           
            .immersive-card { padding: 40px 24px; }
            .contact-title { font-size: 2.2rem; }
           
            /* Modifiche per affiancare Nome/Email alla Faccina */
            .minimal-form {
                position: relative;
            }

            .minimal-form .form-group:nth-child(1),
            .minimal-form .form-group:nth-child(2) {
                width: calc(100% - 130px);
            }

            .character-container {
                position: absolute;
                top: 0;
                right: 0;
                width: 110px;
                margin-top: 0;
            }

            .character-status {
                font-size: 0.8rem;
                white-space: normal;
                line-height: 1.2;
            }

            /* Reset Footer per mobile */
            .form-footer {
                flex-direction: column;
                gap: 30px;
            }
            .submit-btn {
                width: 100%;
                justify-content: center;
            }
             
            .footer {
                flex-direction: column;
                gap: 15px;
                padding: 30px 0;
                margin-top: 60px;
                text-align: center;
            }
            .footer-links { gap: 20px; }
        }
    </style>
</head>
<body>

    <section class="contact-section">

                            <g id="eyeLeft">
                                <ellipse class="eye-white" id="whiteLeft" cx="70" cy="95" rx="18" ry="22" fill="#ffffff" />
                                <ellipse class="pupil" id="pupilLeft" cx="70" cy="95" rx="9" ry="10" fill="#06040a" />
                            </g>
                           
                            <g id="eyeRight">
                                <ellipse class="eye-white" id="whiteRight" cx="130" cy="95" rx="18" ry="22" fill="#ffffff" />
                                <ellipse class="pupil" id="pupilRight" cx="130" cy="95" rx="9" ry="10" fill="#06040a" />
                            </g>
                           
                            <path class="char-mouth" id="characterMouth" d="M 90 135 Q 100 145 110 135" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

     <footer class="footer">

            <li><a href="privacy.html" class="footer-link">Privacy Policy</a></li>

    <script>
         // Gestione Menu Mobile Hamburger ed effetti Wow
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('navMenu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
           
            if(navMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
                document.body.style.overflow = 'auto';
            });
        });
       
        // Cursore personalizzato flessibile
        const cursor = document.getElementById('customCursor');
        const dot = document.getElementById('cursorDot');
        const ring = document.getElementById('cursorRing');

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let dotX = mouseX, dotY = mouseY, ringX = mouseX, ringY = mouseY;

        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        function animateCursor() {
            dotX += (mouseX - dotX); dotY += (mouseY - dotY);
            ringX += (mouseX - ringX) * 0.16; ringY += (mouseY - ringY) * 0.16;
            dot.style.left = `${dotX}px`; dot.style.top = `${dotY}px`;
            ring.style.left = `${ringX}px`; ring.style.top = `${ringY}px`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        function bindCursorEvents() {
            document.querySelectorAll('.interactable').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
            });
        }
        bindCursorEvents();

        // ELEMENTI INTERATTIVI DEL PERSONAGGIO
        const charBody = document.getElementById('charBody');
        const pupilLeft = document.getElementById('pupilLeft');
        const pupilRight = document.getElementById('pupilRight');
        const whiteLeft = document.getElementById('whiteLeft');
        const whiteRight = document.getElementById('whiteRight');
        const mouth = document.getElementById('characterMouth');
        const stars = document.getElementById('celebrationStars');
        const statusText = document.getElementById('characterStatus');
        const ambientGlow = document.getElementById('ambientGlow');
        const submitBtn = document.getElementById('submitBtn');
        const inputs = document.querySelectorAll('.data-input');
        const contactForm = document.getElementById('contactForm');
        const btnText = submitBtn.querySelector("span");

        let isWriting = false;
        let isCelebrating = false;
        const isMobileDevice = window.matchMedia('(pointer: coarse)').matches;

        // Funzione per impostare istantaneamente lo stato di scrittura (condiviso desktop/mobile)
        function setWritingState() {
            if (isCelebrating) return;
            charBody.style.fill = "#113c4c";
            pupilLeft.setAttribute('fill', 'var(--accent-cyan)');
            pupilRight.setAttribute('fill', 'var(--accent-cyan)');
            ambientGlow.style.background = `radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 70%)`;
            mouth.setAttribute('d', 'M 95 135 L 105 135');
            whiteLeft.setAttribute('ry', '24'); whiteRight.setAttribute('ry', '24');
            stars.style.opacity = '0';
            statusText.innerText = "Oh, che bello conoscerti!";
            statusText.style.color = "var(--accent-cyan)";
        }

        // Rileva se l'utente sta scrivendo in un input
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                isWriting = true;
                setWritingState();
            });
            input.addEventListener('blur', () => {
                isWriting = false;
            });
        });

        // FUNZIONE FESTEGGIAMENTO AL SUBMIT
       contactForm.addEventListener('submit', async function(e) {
    e.preventDefault(); // Blocca il ricaricamento della pagina
   
    // Stato visivo di caricamento
    btnText.textContent = "INVIO IN CORSO...";
    submitBtn.disabled = true;

    const formData = new FormData(contactForm);

    try {
        // Sostituisci "TUO_ENDPOINT_QUI" con il link che ti dà Formspree
        const response = await fetch("https://formspree.io/f/xlgyyazv", {
            method: "POST",
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        });

        if (response.ok) {
            triggerCelebration(); // Fa partire la tua animazione festosa
            btnText.textContent = "MESSAGGIO INVIATO!";
            contactForm.reset();  // Svuota i campi
        } else {
            throw new Error("Errore");
        }
    } catch (error) {
        statusText.innerText = "Ops! Qualcosa è andato storto.";
        statusText.style.color = "var(--accent-sad)";
        btnText.textContent = "ERRORE. RIPROVA";
        submitBtn.disabled = false;
    }
});

        function triggerCelebration() {
    isCelebrating = true;
   
    // Animazione Visiva Euforica
    charBody.style.fill = "var(--accent-pink)";
    pupilLeft.setAttribute('fill', '#06040a');
    pupilRight.setAttribute('fill', '#06040a');
    pupilLeft.setAttribute('cx', '70'); pupilLeft.setAttribute('cy', '95');
    pupilRight.setAttribute('cx', '130'); pupilRight.setAttribute('cy', '95');
   
    ambientGlow.style.background = `radial-gradient(circle, rgba(255, 101, 163, 0.3) 0%, transparent 70%)`;
    mouth.setAttribute('d', 'M 85 130 Q 100 160 115 130'); // Sorrisone aperto
    mouth.setAttribute('stroke', '#ffffff');
    whiteLeft.setAttribute('ry', '22'); whiteRight.setAttribute('ry', '22');
    stars.style.opacity = '1';
   
    statusText.innerText = "Grazie! Inviato!";
    statusText.style.color = "var(--accent-pink)";
   
    // Cambiamo subito la scritta sul bottone prima che parta il timer
    btnText.textContent = "MESSAGGIO INVIATO!";

    // Resta in stato festa per 4 secondi, poi si resetta TUTTO insieme
    setTimeout(() => {
        isCelebrating = false;
        stars.style.opacity = '0';
       
        // QUESTE RIGHE DEVONO STARE QUI DENTRO:
        btnText.textContent = "INVIA IL MESSAGGIO";
        submitBtn.disabled = false;
    }, 4000);
}

        // SE SEI SU DESKTOP: Tracciamento Mouse standard
        document.addEventListener('mousemove', (e) => {
            if (isCelebrating || isMobileDevice) return;

            // Inseguimento Occhi
            function movePupil(pupil, centerCx, centerCy) {
                const rect = pupil.getBoundingClientRect();
                const eyeX = rect.left + rect.width / 2;
                const eyeY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
                const maxDistance = 7;
                pupil.setAttribute('cx', centerCx + Math.cos(angle) * maxDistance);
                pupil.setAttribute('cy', centerCy + Math.sin(angle) * maxDistance);
            }
            movePupil(pupilLeft, 70, 95);
            movePupil(pupilRight, 130, 95);

            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;
            const distanceToCenter = Math.hypot(e.clientX - screenCenterX, e.clientY - screenCenterY);
            const maxScreenDistance = Math.hypot(screenCenterX, screenCenterY);

            const btnRect = submitBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distanceToBtn = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

            // Macchina degli stati desktop
            if (distanceToBtn < 150) {
                charBody.style.fill = "var(--accent-pink)";
                ambientGlow.style.background = `radial-gradient(circle, rgba(255, 101, 163, 0.15) 0%, transparent 70%)`;
                mouth.setAttribute('d', 'M 85 130 Q 100 160 115 130');
                mouth.setAttribute('stroke', '#ffffff');
                whiteLeft.setAttribute('ry', '22'); whiteRight.setAttribute('ry', '22');
                statusText.innerText = "Clicca! Inviamolo!";
                statusText.style.color = "var(--accent-pink)";
            }
            else if (isWriting) {
                setWritingState();
            }
            else if (distanceToCenter > maxScreenDistance * 0.65) {
                charBody.style.fill = "var(--accent-sad)";
                ambientGlow.style.background = `radial-gradient(circle, rgba(74, 59, 110, 0.1) 0%, transparent 60%)`;
                mouth.setAttribute('d', 'M 90 145 Q 100 130 110 145');
                mouth.setAttribute('stroke', 'rgba(255,255,255,0.4)');
                whiteLeft.setAttribute('ry', '12'); whiteRight.setAttribute('ry', '12');
                pupilLeft.setAttribute('fill', '#06040a'); pupilRight.setAttribute('fill', '#06040a');
                statusText.innerText = "Dove stai andando?";
                statusText.style.color = "var(--text-secondary)";
            }
            else {
                charBody.style.fill = "#1d1730";
                ambientGlow.style.background = `radial-gradient(circle, rgba(255, 101, 163, 0.04) 0%, transparent 70%)`;
                mouth.setAttribute('d', 'M 90 135 Q 100 145 110 135');
                mouth.setAttribute('stroke', '#ffffff');
                whiteLeft.setAttribute('ry', '22'); whiteRight.setAttribute('ry', '22');
                pupilLeft.setAttribute('fill', '#06040a'); pupilRight.setAttribute('fill', '#06040a');
                statusText.innerText = "Ti sto osservando...";
                statusText.style.color = "rgba(255,255,255,0.3)";
            }
        });

        // SE SEI SU MOBILE: Loop Autonomo di animazione di intelligenza artificiale
        if (isMobileDevice) {
            setInterval(() => {
                if (isCelebrating) return;

                // Se l'utente sta scrivendo attivamente, mantieni il focus visivo muovendo solo leggermente gli occhi
                if (isWriting) {
                    const randomX = (Math.random() - 0.5) * 6;
                    const randomY = (Math.random() - 0.5) * 4;
                    pupilLeft.setAttribute('cx', 70 + randomX);
                    pupilLeft.setAttribute('cy', 93 + randomY);
                    pupilRight.setAttribute('cx', 130 + randomX);
                    pupilRight.setAttribute('cy', 93 + randomY);
                    return;
                }

                // Ciclo casuale di stati "Idle autonomi"
                const states = ['calmo', 'guarda_giro', 'pensieroso'];
                const randomState = states[Math.floor(Math.random() * states.length)];

                if (randomState === 'calmo') {
                    charBody.style.fill = "#1d1730";
                    ambientGlow.style.background = `radial-gradient(circle, rgba(255, 101, 163, 0.04) 0%, transparent 70%)`;
                    mouth.setAttribute('d', 'M 90 135 Q 100 145 110 135');
                    whiteLeft.setAttribute('ry', '22'); whiteRight.setAttribute('ry', '22');
                    pupilLeft.setAttribute('cx', '70'); pupilLeft.setAttribute('cy', '95');
                    pupilRight.setAttribute('cx', '130'); pupilRight.setAttribute('cy', '95');
                    pupilLeft.setAttribute('fill', '#06040a'); pupilRight.setAttribute('fill', '#06040a');
                    statusText.innerText = "Ti sto aspettando...";
                    statusText.style.color = "rgba(255,255,255,0.3)";
                }
                else if (randomState === 'guarda_giro') {
                    // Sceglie a caso una direzione verso cui guardare
                    const lookRight = Math.random() > 0.5;
                    pupilLeft.setAttribute('cx', lookRight ? '76' : '64'); pupilLeft.setAttribute('cy', '95');
                    pupilRight.setAttribute('cx', lookRight ? '136' : '124'); pupilRight.setAttribute('cy', '95');
                    statusText.innerText = "Dai un'occhiata in giro?";
                    statusText.style.color = "rgba(255,255,255,0.4)";
                }
                else if (randomState === 'pensieroso') {
                    charBody.style.fill = "#251b3d";
                    ambientGlow.style.background = `radial-gradient(circle, rgba(74, 59, 110, 0.05) 0%, transparent 70%)`;
                    mouth.setAttribute('d', 'M 90 138 Q 100 142 110 138'); // Sorrisetto timido piatto
                    pupilLeft.setAttribute('cx', '74'); pupilLeft.setAttribute('cy', '88'); // Guarda in alto a destra
                    pupilRight.setAttribute('cx', '134'); pupilRight.setAttribute('cy', '88');
                    statusText.innerText = "Cosa racconterai?";
                    statusText.style.color = "var(--text-secondary)";
                }
            }, 3000); // Aggiorna lo stato autonomo ogni 3 secondi
        }
    </script>
</body>
</html>
